name: Install Misk brand assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  brand-assets:
    if: ${{ !contains(github.event.head_commit.message, 'Install Misk brand assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create logo and favicon assets
        run: |
          mkdir -p public
          cat > public/misk-logo.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1075 735">
            <defs>
              <linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8d5b16"/><stop offset=".45" stop-color="#f4d47d"/><stop offset="1" stop-color="#a66a18"/></linearGradient>
              <linearGradient id="burg" x1="0" x2="1"><stop stop-color="#5a0013"/><stop offset=".5" stop-color="#8f1028"/><stop offset="1" stop-color="#4b0010"/></linearGradient>
            </defs>
            <rect width="1075" height="735" fill="#faf3e7"/>
            <g stroke="url(#gold)" fill="none" stroke-width="2"><path d="M70 230H385"/><path d="M690 230h315"/><path d="M70 600h315"/><path d="M690 600h315"/></g>
            <g transform="translate(537 205)">
              <path d="M-105 25 Q-150 -20 -185 -45 Q-155 -50 -130 -20 Q-120 -75 -55 -62 Q-30 -55 0 -15 Q30 -55 55 -62 Q120 -75 130 -20 Q155 -50 185 -45 Q150 -20 105 25 Q0 55 -105 25Z" fill="url(#burg)" stroke="url(#gold)" stroke-width="7"/>
              <path d="M-108 28 Q0 0 108 28 L102 50 Q0 22 -102 50Z" fill="url(#gold)"/>
              <path d="M0 -112 L30 -70 L0 -27 L-30 -70Z" fill="url(#burg)" stroke="url(#gold)" stroke-width="6"/>
              <circle cx="-185" cy="-45" r="9" fill="#d7a83e"/><circle cx="185" cy="-45" r="9" fill="#d7a83e"/><circle cx="-130" cy="-20" r="7" fill="#d7a83e"/><circle cx="130" cy="-20" r="7" fill="#d7a83e"/>
            </g>
            <text x="537" y="470" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="245" letter-spacing="12" fill="url(#burg)">MISK</text>
            <path d="M275 488 Q535 390 800 488" fill="none" stroke="url(#gold)" stroke-width="8"/>
            <text x="537" y="555" text-anchor="middle" font-family="Arial,sans-serif" font-size="49" letter-spacing="18" fill="#5b1728">COLLECTIONS</text>
            <g stroke="url(#gold)" fill="none" stroke-width="4"><path d="M290 575H440"/><path d="M635 575H785"/></g>
            <path d="M537 590 l22 30 -22 34 -22-34z" fill="url(#burg)" stroke="url(#gold)" stroke-width="4"/>
          </svg>
          SVG
          cat > public/misk-favicon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#8d5b16"/><stop offset=".5" stop-color="#f4d47d"/><stop offset="1" stop-color="#a66a18"/></linearGradient></defs>
            <rect x="5" y="5" width="246" height="246" rx="48" fill="#5b1728" stroke="url(#g)" stroke-width="8"/>
            <path d="M65 82 Q52 60 38 52 Q61 48 79 68 Q88 39 113 48 Q128 53 128 72 Q128 53 143 48 Q168 39 177 68 Q195 48 218 52 Q204 60 191 82 Q128 105 65 82Z" fill="#5b1728" stroke="url(#g)" stroke-width="6"/>
            <path d="M128 28 L143 50 L128 72 L113 50Z" fill="#8f1028" stroke="url(#g)" stroke-width="5"/>
            <text x="128" y="150" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="78" letter-spacing="2" fill="#fff7e8">MISK</text>
            <path d="M60 160 Q128 133 196 160" fill="none" stroke="url(#g)" stroke-width="5"/>
            <text x="128" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" letter-spacing="4" fill="#f4d47d">COLLECTIONS</text>
          </svg>
          SVG
      - name: Use logo in header and favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/store.jsx'); s=p.read_text()
          old='<span className="misk-brand"><span className="misk-crown">♛</span>MISK</span><small>COLLECTIONS</small>'
          new='<img className="misk-logo" src="/misk-logo.svg" alt="Misk Collections" />'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          css=Path('src/styles.css'); c=css.read_text()
          c += '\n.misk-logo{width:142px;height:58px;object-fit:contain;display:block}.brand{display:flex;align-items:center;padding:0}.brand .misk-logo{max-width:142px}@media(max-width:900px){.misk-logo{width:125px;height:52px}}\n'
          css.write_text(c)
          idx=Path('index.html'); h=idx.read_text()
          h=h.replace('<meta name="theme-color" content="#5b1728" />','<meta name="theme-color" content="#5b1728" />\n    <link rel="icon" type="image/svg+xml" href="/misk-favicon.svg" />\n    <link rel="apple-touch-icon" href="/misk-favicon.svg" />')
          h=h.replace('<title>Misk Collections — Affordable Pakistani Elegance</title>','<title>Misk Collections — Affordable Pakistani Elegance</title>')
          idx.write_text(h)
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/install-misk-brand-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/misk-logo.svg public/misk-favicon.svg src/store.jsx src/styles.css index.html .github/workflows/install-misk-brand-assets.yml
          git commit -m "Install Misk brand assets"
          git push
