name: Connect storefront to live products

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect storefront to Supabase products
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/main.jsx')
          text = path.read_text()

          if 'LIVE PRODUCTS PATCH' in text:
              print('Live products patch already applied; nothing to do.')
              raise SystemExit(0)

          text = text.replace(
              'import React, { useMemo, useState } from "react";',
              'import React, { useEffect, useMemo, useState } from "react";\nimport { supabase } from "./supabase";'
          )

          text = text.replace('const products = [', 'const fallbackProducts = [', 1)

          marker = '\nconst categoryCards = ['
          if marker not in text:
              raise SystemExit('Could not find product-array boundary.')

          live_block = r'''

// LIVE PRODUCTS PATCH: Admin changes are loaded from Supabase.
let products = fallbackProducts;
const normalizeLiveProduct = (p, index) => {
  const image = p.image_URL || p.image_url || p.image || "";
  const split = value => Array.isArray(value) ? value : String(value || "").split(",").map(x => x.trim()).filter(Boolean);
  const category = p.category || "Casual";
  const type = p.type || (category === "Co-ords" ? "Co-ord" : category === "3-Piece" ? "3-Piece" : "2-Piece");
  return {
    ...p,
    id: p.id ?? `live-${index}`,
    name: p.name || "Misk Collection",
    category,
    style: p.style || category,
    type,
    price: Number(p.price) || 0,
    salePrice: p.sale_price == null || p.sale_price === "" ? null : Number(p.sale_price),
    sizes: split(p.sizes),
    colors: split(p.colors),
    fabric: p.fabric || "Premium fabric",
    stock: Number(p.stock) || 0,
    newArrival: Boolean(p.new_arrival ?? p.newArrival),
    featured: Boolean(p.featured),
    bestseller: Boolean(p.bestseller),
    desc: p.description || p.desc || "",
    images: image ? [image] : (Array.isArray(p.images) && p.images.length ? p.images : [])
  };
};
'''
          text = text.replace(marker, live_block + marker, 1)

          app_state = '  const [checkoutDone,setCheckoutDone] = useState(false);'
          live_effect = r'''
  const [checkoutDone,setCheckoutDone] = useState(false);
  const [liveProductsVersion,setLiveProductsVersion] = useState(0);

  useEffect(()=>{
    let alive=true;
    const loadLiveProducts=async()=>{
      try{
        const {data,error}=await supabase.from("products").select("*").order("id",{ascending:false});
        if(error) throw error;
        if(alive && Array.isArray(data) && data.length){
          products=data.map(normalizeLiveProduct);
          setLiveProductsVersion(v=>v+1);
        }
      }catch(error){
        console.warn("Live product sync unavailable; using storefront fallback products.",error);
      }
    };
    loadLiveProducts();
    return ()=>{alive=false};
  },[]);'''
          if app_state not in text:
              raise SystemExit('Could not find App state boundary.')
          text = text.replace(app_state, live_effect, 1)

          text = text.replace('  },[filters,search]);', '  },[filters,search,liveProductsVersion]);', 1)
          text = text.replace('  return <div className="app">', '  return <div className="app">', 1)

          path.write_text(text)
      - name: Commit storefront sync
        run: |
          if git diff --quiet; then
            echo "No storefront changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "Connect storefront products to Supabase"
          git push
