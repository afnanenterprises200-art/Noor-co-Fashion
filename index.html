<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5b1728" />
    <meta name="description" content="Affordable elegant Pakistani women's wear — modern silhouettes, thoughtful details and nationwide COD." />
    <title>Misk Collections — Affordable Pakistani Elegance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/store.jsx"></script>
    <script>
      const renameBrand = () => {
        document.querySelectorAll('.brand span').forEach(el => el.textContent = 'MISK');
        document.querySelectorAll('.brand small').forEach(el => el.textContent = ' COLLECTIONS');
      };
      new MutationObserver(renameBrand).observe(document.documentElement, {subtree:true, childList:true});
      renameBrand();
    </script>
  </body>
</html>
